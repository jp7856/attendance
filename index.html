<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 기록</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ================================================================
     ✏️ 여기만 수정하세요!
     ================================================================ */
  const SUPABASE_URL = ""; /* 이 파일은 HTML입니다. 아래 script 태그 안의 설정을 수정하세요 */

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3347;
    --accent: #4f8ef7;
    --accent2: #38d9a9;
    --warn: #ffa94d;
    --text: #e8eaf0;
    --text2: #8b90a7;
    --checkin: #38d9a9;
    --checkout: #4f8ef7;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
  }

  /* 배경 그라디언트 효과 */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(79,142,247,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* 헤더 */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .subtitle {
    font-size: 12px;
    color: var(--text2);
    font-weight: 300;
  }

  .today-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text2);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
  }

  /* 오늘 카드 */
  .today-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .today-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .today-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
  }

  .today-times {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 500px) {
    .today-times { grid-template-columns: 1fr; }
  }

  .time-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .time-block-label {
    font-size: 11px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-checkin { background: var(--checkin); }
  .dot-checkout { background: var(--checkout); }
  .dot-work { background: var(--warn); }

  .time-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -1px;
  }

  .time-value.empty { color: var(--text2); font-size: 20px; }
  .time-value.checkin { color: var(--checkin); }
  .time-value.checkout { color: var(--checkout); }
  .time-value.work { color: var(--warn); }

  /* 통계 카드들 */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }

  @media (max-width: 600px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 8px;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
  }

  .stat-unit {
    font-size: 12px;
    color: var(--text2);
    margin-left: 4px;
  }

  /* 테이블 */
  .table-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .table-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .table-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 28px; height: 28px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }

  .nav-btn:hover { background: var(--border); }

  .month-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text2);
    min-width: 70px;
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    text-align: left;
    padding: 10px 20px;
    background: var(--surface2);
    letter-spacing: 0.5px;
  }

  td {
    padding: 12px 20px;
    font-size: 13px;
    border-top: 1px solid var(--border);
  }

  tr:hover td { background: rgba(255,255,255,0.02); }

  .td-date {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text2);
    font-size: 12px;
  }

  .td-day {
    font-size: 11px;
    color: var(--text2);
  }

  .td-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .td-time.ci { color: var(--checkin); }
  .td-time.co { color: var(--checkout); }
  .td-time.wt { color: var(--warn); }
  .td-time.empty { color: var(--border); }

  .tag-weekend {
    font-size: 10px;
    background: rgba(255,255,255,0.05);
    color: var(--text2);
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 6px;
  }

  /* 로딩/에러 */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text2);
    font-size: 13px;
  }

  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    text-align: center;
    padding: 30px;
    color: #ff6b6b;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">
      <div class="logo-icon">⏱</div>
      <div>
        <h1>출퇴근 기록</h1>
        <div class="subtitle">자동 근태 트래커</div>
      </div>
    </div>
    <div class="today-badge" id="todayBadge">--</div>
  </header>

  <!-- 오늘 카드 -->
  <div class="today-card">
    <div class="today-label">오늘</div>
    <div class="today-times">
      <div class="time-block">
        <div class="time-block-label"><span class="dot dot-checkin"></span>출근</div>
        <div class="time-value empty" id="todayCheckin">--:--</div>
      </div>
      <div class="time-block">
        <div class="time-block-label"><span class="dot dot-checkout"></span>퇴근</div>
        <div class="time-value empty" id="todayCheckout">--:--</div>
      </div>
      <div class="time-block">
        <div class="time-block-label"><span class="dot dot-work"></span>근무시간</div>
        <div class="time-value empty" id="todayWork">--:--</div>
      </div>
    </div>
  </div>

  <!-- 이번 달 통계 -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">이번 달 출근일</div>
      <div class="stat-value" id="statDays">--<span class="stat-unit">일</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">평균 출근시간</div>
      <div class="stat-value" id="statAvgIn">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">평균 근무시간</div>
      <div class="stat-value" id="statAvgWork">--<span class="stat-unit">h</span></div>
    </div>
  </div>

  <!-- 기록 테이블 -->
  <div class="table-section">
    <div class="table-header">
      <div class="table-title">월별 기록</div>
      <div class="month-nav">
        <button class="nav-btn" id="prevBtn">‹</button>
        <div class="month-label" id="monthLabel">--</div>
        <button class="nav-btn" id="nextBtn">›</button>
      </div>
    </div>
    <div id="tableArea">
      <div class="loading"><div class="spinner"></div>불러오는 중...</div>
    </div>
  </div>

</div>

<script>
// ================================================================
// ✏️ 여기만 수정하세요!
const  SUPABASE_URL = "https://zfqpskhlgdlgvefoqdbq.supabase.co/"       # 예: https://abcdefgh.supabase.co
const  SUPABASE_KEY = "sb_publishable_1lh8wcULjDZCawBcEg0Uyg_9mefHJ8B"      // 예: eyJhbGci...
// ================================================================

const DAYS = ["일", "월", "화", "수", "목", "금", "토"];

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;

async function fetchRecords(year, month) {
  const from = `${year}-${String(month).padStart(2,'0')}-01`;
  const lastDay = new Date(year, month, 0).getDate();
  const to = `${year}-${String(month).padStart(2,'0')}-${lastDay}`;

  const url = `${SUPABASE_URL}/rest/v1/attendance?date=gte.${from}&date=lte.${to}&order=date.asc`;
  const res = await fetch(url, {
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`
    }
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

function calcWorkHours(cin, cout) {
  if (!cin || !cout) return null;
  const [ih, im] = cin.split(":").map(Number);
  const [oh, om] = cout.split(":").map(Number);
  const mins = (oh * 60 + om) - (ih * 60 + im);
  if (mins <= 0) return null;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return { h, m, total: mins };
}

function formatTime(t) {
  if (!t) return null;
  return t.slice(0, 5); // HH:MM
}

function renderToday(records) {
  const today = new Date();
  const todayStr = today.toISOString().slice(0, 10);
  document.getElementById("todayBadge").textContent =
    `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')} (${DAYS[today.getDay()]})`;

  const rec = records.find(r => r.date === todayStr);
  if (rec) {
    const cin = formatTime(rec.checkin_time);
    const cout = formatTime(rec.checkout_time);
    const work = calcWorkHours(rec.checkin_time, rec.checkout_time);

    if (cin) {
      document.getElementById("todayCheckin").textContent = cin;
      document.getElementById("todayCheckin").className = "time-value checkin";
    }
    if (cout) {
      document.getElementById("todayCheckout").textContent = cout;
      document.getElementById("todayCheckout").className = "time-value checkout";
    }
    if (work) {
      document.getElementById("todayWork").textContent = `${work.h}h ${String(work.m).padStart(2,'0')}m`;
      document.getElementById("todayWork").className = "time-value work";
    }
  }
}

function renderStats(records) {
  const withCheckin = records.filter(r => r.checkin_time);
  document.getElementById("statDays").innerHTML =
    `${withCheckin.length}<span class="stat-unit">일</span>`;

  if (withCheckin.length > 0) {
    const avgInMins = withCheckin.reduce((sum, r) => {
      const [h, m] = r.checkin_time.split(":").map(Number);
      return sum + h * 60 + m;
    }, 0) / withCheckin.length;
    const ah = Math.floor(avgInMins / 60);
    const am = Math.round(avgInMins % 60);
    document.getElementById("statAvgIn").textContent =
      `${String(ah).padStart(2,'0')}:${String(am).padStart(2,'0')}`;
  }

  const withWork = records.filter(r => r.checkin_time && r.checkout_time);
  if (withWork.length > 0) {
    const avgMins = withWork.reduce((sum, r) => {
      const w = calcWorkHours(r.checkin_time, r.checkout_time);
      return sum + (w ? w.total : 0);
    }, 0) / withWork.length;
    document.getElementById("statAvgWork").innerHTML =
      `${(avgMins / 60).toFixed(1)}<span class="stat-unit">h</span>`;
  }
}

function renderTable(records) {
  if (records.length === 0) {
    document.getElementById("tableArea").innerHTML =
      `<div class="loading" style="color:var(--text2)">이 달의 기록이 없습니다</div>`;
    return;
  }

  const rows = records.map(r => {
    const d = new Date(r.date + "T00:00:00");
    const day = DAYS[d.getDay()];
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const cin = formatTime(r.checkin_time);
    const cout = formatTime(r.checkout_time);
    const work = calcWorkHours(r.checkin_time, r.checkout_time);

    return `<tr>
      <td>
        <span class="td-date">${r.date}</span>
        <span class="td-day">${day}${isWeekend ? '<span class="tag-weekend">주말</span>' : ''}</span>
      </td>
      <td class="td-time ci">${cin || '<span class="empty">--:--</span>'}</td>
      <td class="td-time co">${cout || '<span class="empty">--:--</span>'}</td>
      <td class="td-time wt">${work ? `${work.h}h ${String(work.m).padStart(2,'0')}m` : '<span class="empty">--</span>'}</td>
    </tr>`;
  }).join('');

  document.getElementById("tableArea").innerHTML = `
    <table>
      <thead>
        <tr>
          <th>날짜</th>
          <th>출근</th>
          <th>퇴근</th>
          <th>근무시간</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function load() {
  document.getElementById("monthLabel").textContent =
    `${currentYear}.${String(currentMonth).padStart(2,'0')}`;
  document.getElementById("tableArea").innerHTML =
    `<div class="loading"><div class="spinner"></div>불러오는 중...</div>`;

  try {
    const records = await fetchRecords(currentYear, currentMonth);
    const isCurrentMonth = currentYear === new Date().getFullYear() &&
                           currentMonth === new Date().getMonth() + 1;
    if (isCurrentMonth) {
      renderToday(records);
      renderStats(records);
    }
    renderTable(records);
  } catch (e) {
    document.getElementById("tableArea").innerHTML =
      `<div class="error-msg">⚠️ 데이터를 불러올 수 없습니다.<br><small>${e.message}</small><br><br>
       <small style="color:var(--text2)">SUPABASE_URL과 SUPABASE_KEY를 확인해주세요</small></div>`;
  }
}

document.getElementById("prevBtn").addEventListener("click", () => {
  currentMonth--;
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  load();
});

document.getElementById("nextBtn").addEventListener("click", () => {
  currentMonth++;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  load();
});

load();
</script>
</body>
</html>
