<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 기록</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3347;
    --accent: #4f8ef7;
    --accent2: #38d9a9;
    --warn: #ffa94d;
    --text: #e8eaf0;
    --text2: #8b90a7;
    --checkin: #38d9a9;
    --checkout: #4f8ef7;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  h1 { font-size: 20px; font-weight: 700; }
  .subtitle { font-size: 12px; color: var(--text2); font-weight: 300; }
  .today-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text2);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
  }
  .today-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .today-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .today-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
  }
  .today-times {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
  }
  .time-block { display: flex; flex-direction: column; gap: 6px; }
  .time-block-label { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot-checkin { background: var(--checkin); }
  .dot-checkout { background: var(--checkout); }
  .dot-work { background: var(--warn); }
  .time-value { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 600; letter-spacing: -1px; }
  .time-value.empty { color: var(--text2); font-size: 20px; }
  .time-value.checkin { color: var(--checkin); }
  .time-value.checkout { color: var(--checkout); }
  .time-value.work { color: var(--warn); }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  .stat-label { font-size: 11px; color: var(--text2); margin-bottom: 8px; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; }
  .stat-unit { font-size: 12px; color: var(--text2); margin-left: 4px; }
  .table-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .table-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .table-title { font-size: 13px; font-weight: 600; }
  .month-nav { display: flex; align-items: center; gap: 10px; }
  .nav-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 28px; height: 28px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: var(--border); }
  .month-label { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text2); min-width: 70px; text-align: center; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 500; color: var(--text2); text-align: left; padding: 10px 20px; background: var(--surface2); }
  td { padding: 12px 20px; font-size: 13px; border-top: 1px solid var(--border); }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .td-date { font-family: 'JetBrains Mono', monospace; color: var(--text2); font-size: 12px; }
  .td-time { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .ci { color: var(--checkin); }
  .co { color: var(--checkout); }
  .wt { color: var(--warn); }
  .empty-cell { color: var(--border); }
  .loading { text-align: center; padding: 40px; color: var(--text2); font-size: 13px; }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 500px) {
    .today-times { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">⏱</div>
      <div>
        <h1>출퇴근 기록</h1>
        <div class="subtitle">자동 근태 트래커</div>
      </div>
    </div>
    <div class="today-badge" id="todayBadge">--</div>
  </header>

  <div class="today-card">
    <div class="today-label">오늘</div>
    <div class="today-times">
      <div class="time-block">
        <div class="time-block-label"><span class="dot dot-checkin"></span>출근</div>
        <div class="time-value empty" id="todayCheckin">--:--</div>
      </div>
      <div class="time-block">
        <div class="time-block-label"><span class="dot dot-checkout"></span>퇴근</div>
        <div class="time-value empty" id="todayCheckout">--:--</div>
      </div>
      <div class="time-block">
        <div class="time-block-label"><span class="dot dot-work"></span>근무시간</div>
        <div class="time-value empty" id="todayWork">--:--</div>
      </div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">이번 달 출근일</div>
      <div class="stat-value" id="statDays">--<span class="stat-unit">일</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">평균 출근시간</div>
      <div class="stat-value" id="statAvgIn">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">평균 근무시간</div>
      <div class="stat-value" id="statAvgWork">--<span class="stat-unit">h</span></div>
    </div>
  </div>

  <div class="table-section">
    <div class="table-header">
      <div class="table-title">월별 기록</div>
      <div class="month-nav">
        <button class="nav-btn" id="prevBtn">&#8249;</button>
        <div class="month-label" id="monthLabel">--</div>
        <button class="nav-btn" id="nextBtn">&#8250;</button>
      </div>
    </div>
    <div id="tableArea">
      <div class="loading"><div class="spinner"></div>불러오는 중...</div>
    </div>
  </div>
</div>

<script>
// ================================================================
// ✏️ 여기만 수정하세요! (Sheets ID)
var SHEET_ID = "10Sy40fmnS4DCtVk3a83p-63TAp_WUkAS8mhG9YA4xCA";
// ================================================================

var DAYS = ['일','월','화','수','목','금','토'];
var currentYear = new Date().getFullYear();
var currentMonth = new Date().getMonth() + 1;
var allRecords = [];

var CSV_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/export?format=csv&gid=0";

function parseCSV(text) {
  var lines = text.trim().split('\n');
  var records = [];
  for (var i = 1; i < lines.length; i++) {
    var cols = lines[i].split(',');
    if (cols[0] && cols[0].trim()) {
      records.push({
        date: cols[0].trim(),
        checkin: (cols[1] || '').trim(),
        checkout: (cols[2] || '').trim(),
        work: (cols[3] || '').trim()
      });
    }
  }
  return records;
}

function fmt(t) {
  if (!t) return null;
  return t.slice(0, 5);
}

function renderToday(records) {
  var today = new Date();
  var todayStr = today.getFullYear() + '-' +
    String(today.getMonth()+1).padStart(2,'0') + '-' +
    String(today.getDate()).padStart(2,'0');
  document.getElementById('todayBadge').textContent =
    todayStr + ' (' + DAYS[today.getDay()] + ')';

  var rec = records.find(function(r) { return r.date === todayStr; });
  if (!rec) return;

  if (rec.checkin && rec.checkin !== '(미기록)') {
    document.getElementById('todayCheckin').textContent = fmt(rec.checkin);
    document.getElementById('todayCheckin').className = 'time-value checkin';
  }
  if (rec.checkout) {
    document.getElementById('todayCheckout').textContent = fmt(rec.checkout);
    document.getElementById('todayCheckout').className = 'time-value checkout';
  }
  if (rec.work) {
    document.getElementById('todayWork').textContent = rec.work;
    document.getElementById('todayWork').className = 'time-value work';
  }
}

function renderStats(records) {
  var now = new Date();
  var ym = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  var thisMonth = records.filter(function(r) {
    return r.date.startsWith(ym) && r.checkin && r.checkin !== '(미기록)';
  });

  document.getElementById('statDays').innerHTML = thisMonth.length + '<span class="stat-unit">일</span>';

  if (thisMonth.length > 0) {
    var avgIn = thisMonth.reduce(function(s, r) {
      var p = r.checkin.split(':').map(Number);
      return s + p[0]*60 + (p[1]||0);
    }, 0) / thisMonth.length;
    var ah = Math.floor(avgIn/60), am = Math.round(avgIn%60);
    document.getElementById('statAvgIn').textContent =
      String(ah).padStart(2,'0') + ':' + String(am).padStart(2,'0');
  }

  var withWork = thisMonth.filter(function(r) { return r.work; });
  if (withWork.length > 0) {
    var avgM = withWork.reduce(function(s, r) {
      var m = r.work.match(/(\d+)h\s*(\d+)m/);
      return s + (m ? parseInt(m[1])*60 + parseInt(m[2]) : 0);
    }, 0) / withWork.length;
    document.getElementById('statAvgWork').innerHTML =
      (avgM/60).toFixed(1) + '<span class="stat-unit">h</span>';
  }
}

function renderTable(records) {
  var ym = currentYear + '-' + String(currentMonth).padStart(2,'0');
  var filtered = records.filter(function(r) { return r.date.startsWith(ym); });

  if (filtered.length === 0) {
    document.getElementById('tableArea').innerHTML =
      '<div class="loading" style="color:var(--text2)">이 달의 기록이 없습니다</div>';
    return;
  }

  var rows = filtered.map(function(r) {
    var d = new Date(r.date + 'T00:00:00');
    var day = DAYS[d.getDay()];
    return '<tr>' +
      '<td><span class="td-date">' + r.date + '</span> ' + day + '</td>' +
      '<td class="td-time ci">' + (fmt(r.checkin) || '<span class="empty-cell">--:--</span>') + '</td>' +
      '<td class="td-time co">' + (fmt(r.checkout) || '<span class="empty-cell">--:--</span>') + '</td>' +
      '<td class="td-time wt">' + (r.work || '<span class="empty-cell">--</span>') + '</td>' +
      '</tr>';
  }).join('');

  document.getElementById('tableArea').innerHTML =
    '<table><thead><tr><th>날짜</th><th>출근</th><th>퇴근</th><th>근무시간</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function load() {
  document.getElementById('monthLabel').textContent =
    currentYear + '.' + String(currentMonth).padStart(2,'0');
  document.getElementById('tableArea').innerHTML =
    '<div class="loading"><div class="spinner"></div>불러오는 중...</div>';

  fetch(CSV_URL)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(text) {
      allRecords = parseCSV(text);
      renderToday(allRecords);
      renderStats(allRecords);
      renderTable(allRecords);
    })
    .catch(function(e) {
      document.getElementById('tableArea').innerHTML =
        '<div class="loading" style="color:#ff6b6b">연결 실패: ' + e.message + '<br>' +
        '<small style="color:var(--text2)">Sheets를 "링크가 있는 모든 사용자 - 뷰어"로 공개해주세요</small></div>';
    });
}

document.getElementById('prevBtn').addEventListener('click', function() {
  currentMonth--;
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  renderTable(allRecords);
  document.getElementById('monthLabel').textContent =
    currentYear + '.' + String(currentMonth).padStart(2,'0');
});
document.getElementById('nextBtn').addEventListener('click', function() {
  currentMonth++;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  renderTable(allRecords);
  document.getElementById('monthLabel').textContent =
    currentYear + '.' + String(currentMonth).padStart(2,'0');
});

load();
</script>
</body>
</html>
